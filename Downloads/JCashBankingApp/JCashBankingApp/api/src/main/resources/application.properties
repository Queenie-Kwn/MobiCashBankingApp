server.port=8080
spring.datasource.url=${MOBICASH_DB_URL:jdbc:mysql://localhost:3306/mobicash_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila}
spring.datasource.username=${MOBICASH_DB_USER:root}
spring.datasource.password=${MOBICASH_DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mobicash.jwt.secret=${MOBICASH_JWT_SECRET:mobicash-super-secret-key-change-in-production-min32chars}
mobicash.jwt.expiration-ms=86400000
